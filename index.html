<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>LEVELYN Esports — Level Up With LEVELYN</title>
<meta name="description" content="LEVELYN Esports — A visionary esports organization shaping the future of competitive gaming in Bangladesh.">
<meta property="og:title" content="LEVELYN Esports">
<meta property="og:description" content="Level Up With LEVELYN — Bangladesh's premier esports organization.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=Syne+Mono&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

<style>
/* ============================================================
   TOKENS — Black & White editorial theme
   ============================================================ */
:root {
  --black:   #000000;
  --white:   #FFFFFF;
  --off-wh:  #F4F4F0;
  --grey-1:  #111111;
  --grey-2:  #1A1A1A;
  --grey-3:  #2A2A2A;
  --grey-4:  #3D3D3D;
  --grey-5:  #666666;
  --grey-6:  #999999;
  --grey-7:  #CCCCCC;
  --accent:  #FFFFFF;    /* accent = white on black */
  --danger:  #FF3333;    /* single pop of colour — red only on badges */

  --ff-title: 'Syne', sans-serif;
  --ff-mono:  'Syne Mono', monospace;
  --ff-body:  'DM Sans', sans-serif;

  --nav-h:   60px;
  --max:     1280px;
  --pad:     clamp(1.25rem, 5vw, 4rem);
  --r:       2px;

  --ease:    cubic-bezier(0.16, 1, 0.3, 1);
}

/* ============================================================
   RESET
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
body {
  background: var(--black);
  color: var(--grey-7);
  font-family: var(--ff-body);
  font-size: 16px;
  line-height: 1.6;
  overflow-x: hidden;
}
a { color: inherit; text-decoration: none; }
img { display: block; max-width: 100%; }
button { font-family: inherit; cursor: pointer; }
ul { list-style: none; }

/* ============================================================
   SCROLLBAR
   ============================================================ */
::-webkit-scrollbar { width: 2px; }
::-webkit-scrollbar-track { background: var(--black); }
::-webkit-scrollbar-thumb { background: var(--grey-4); }

/* ============================================================
   UTILITY
   ============================================================ */
.wrap        { max-width: var(--max); margin: 0 auto; padding: 0 var(--pad); }
.divider     { height: 1px; background: var(--grey-3); }
.tag-label   {
  display: inline-flex; align-items: center; gap: .5rem;
  font-family: var(--ff-mono); font-size: .65rem; letter-spacing: .22em;
  text-transform: uppercase; color: var(--grey-5);
}
.tag-label::before { content: '//'; color: var(--grey-4); }
.section-title {
  font-family: var(--ff-title); font-weight: 800;
  font-size: clamp(2.4rem, 6vw, 5rem);
  color: var(--white); line-height: .95; letter-spacing: -.02em;
}
.section-lead {
  font-size: clamp(.9rem, 1.5vw, 1rem); font-weight: 300;
  color: var(--grey-5); line-height: 1.8; max-width: 480px;
}
.btn {
  display: inline-flex; align-items: center; gap: .5rem;
  font-family: var(--ff-title); font-weight: 700; font-size: .78rem;
  letter-spacing: .1em; text-transform: uppercase;
  padding: .75rem 1.8rem; border-radius: var(--r);
  transition: all .22s var(--ease); white-space: nowrap; border: none;
}
.btn--white  { background: var(--white); color: var(--black); }
.btn--white:hover { background: var(--off-wh); transform: translateY(-1px); box-shadow: 0 8px 28px rgba(255,255,255,.12); }
.btn--ghost  { background: transparent; color: var(--white); border: 1px solid var(--grey-4); }
.btn--ghost:hover { border-color: var(--white); }

/* ============================================================
   NOISE GRAIN OVERLAY
   ============================================================ */
body::after {
  content: '';
  position: fixed; inset: 0; z-index: 9000; pointer-events: none;
  opacity: .025;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-size: 200px 200px;
}

/* ============================================================
   NAVBAR
   ============================================================ */
.nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 800;
  height: var(--nav-h);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 var(--pad);
  background: rgba(0,0,0,.88);
  backdrop-filter: blur(20px) saturate(180%);
  border-bottom: 1px solid var(--grey-3);
  transition: border-color .3s;
}
.nav.scrolled { border-bottom-color: var(--grey-2); }
.nav__logo { height: 30px; filter: brightness(0) invert(1); opacity: .9; }
.nav__links { display: flex; gap: 2rem; }
.nav__links a {
  font-family: var(--ff-title); font-weight: 600; font-size: .72rem;
  letter-spacing: .12em; text-transform: uppercase;
  color: var(--grey-5); transition: color .18s; position: relative;
}
.nav__links a::after {
  content: ''; position: absolute; bottom: -4px; left: 0; right: 0;
  height: 1px; background: var(--white);
  transform: scaleX(0); transform-origin: left; transition: transform .22s var(--ease);
}
.nav__links a:hover { color: var(--white); }
.nav__links a:hover::after, .nav__links a.active::after { transform: scaleX(1); }
.nav__links a.active { color: var(--white); }
.nav__cta {
  font-family: var(--ff-title); font-weight: 700; font-size: .68rem;
  letter-spacing: .12em; text-transform: uppercase;
  padding: .45rem 1.2rem; border: 1px solid var(--grey-4);
  color: var(--white); border-radius: var(--r); transition: all .18s;
}
.nav__cta:hover { background: var(--white); color: var(--black); border-color: var(--white); }
/* hamburger */
.nav__ham {
  display: none; flex-direction: column; gap: 5px;
  cursor: pointer; padding: 4px; background: none; border: none;
}
.nav__ham span {
  display: block; width: 20px; height: 1.5px;
  background: var(--white); transition: all .28s var(--ease);
}
.nav__ham.open span:nth-child(1) { transform: translateY(6.5px) rotate(45deg); }
.nav__ham.open span:nth-child(2) { opacity: 0; transform: scaleX(0); }
.nav__ham.open span:nth-child(3) { transform: translateY(-6.5px) rotate(-45deg); }
/* drawer */
.drawer {
  display: none; position: fixed; inset: var(--nav-h) 0 0 0;
  background: var(--black); z-index: 799;
  flex-direction: column; padding: 2rem var(--pad) 3rem;
  overflow-y: auto; border-top: 1px solid var(--grey-3);
  animation: drawerIn .3s var(--ease) both;
}
@keyframes drawerIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
.drawer.open { display: flex; }
.drawer__link {
  font-family: var(--ff-title); font-weight: 700;
  font-size: clamp(1.6rem, 6vw, 2.2rem); letter-spacing: -.01em;
  color: var(--white); padding: 1rem 0; border-bottom: 1px solid var(--grey-3);
  transition: color .15s; display: block;
}
.drawer__link:hover { color: var(--grey-6); }
.drawer__link:last-child { border: none; }
.drawer__contact {
  margin-top: auto; padding-top: 2rem;
  font-family: var(--ff-mono); font-size: .75rem; color: var(--grey-5);
}

/* ============================================================
   HERO
   ============================================================ */
.hero {
  min-height: 100svh; padding-top: var(--nav-h);
  display: flex; flex-direction: column;
  position: relative; overflow: hidden;
}
/* large BG text */
.hero__bg-word {
  position: absolute; bottom: -2vw; left: -.02em; z-index: 0;
  font-family: var(--ff-title); font-weight: 800;
  font-size: clamp(6rem, 22vw, 20rem); line-height: 1;
  color: transparent; -webkit-text-stroke: 1px var(--grey-3);
  pointer-events: none; user-select: none; letter-spacing: -.03em;
  white-space: nowrap;
}
/* horizontal rule lines */
.hero__line {
  position: absolute; left: 0; right: 0; height: 1px; background: var(--grey-3);
}
.hero__line:nth-child(1) { top: 30%; }
.hero__line:nth-child(2) { top: 65%; }

.hero__inner {
  position: relative; z-index: 2;
  flex: 1; display: grid;
  grid-template-columns: 1fr 1fr;
  align-items: center;
  padding: 4rem var(--pad) 2rem;
  gap: 3rem;
}
.hero__left { display: flex; flex-direction: column; gap: 1.6rem; }
.hero__eyebrow {
  font-family: var(--ff-mono); font-size: .68rem;
  letter-spacing: .28em; text-transform: uppercase; color: var(--grey-5);
  display: flex; align-items: center; gap: .6rem;
  animation: fadeUp .8s var(--ease) both;
}
.hero__eyebrow::before { content: ''; width: 32px; height: 1px; background: var(--grey-5); }
.hero__logo-wrap { animation: fadeUp .8s var(--ease) .08s both; }
.hero__logo-img {
  width: min(340px, 80vw);
  filter: brightness(0) invert(1);
  drop-shadow: none;
}
.hero__tagline {
  font-family: var(--ff-title); font-weight: 800;
  font-size: clamp(1rem, 2.5vw, 1.35rem); letter-spacing: .28em;
  text-transform: uppercase; color: var(--grey-4);
  animation: fadeUp .8s var(--ease) .15s both;
}
.hero__desc {
  font-size: clamp(.9rem, 1.4vw, 1rem); font-weight: 300;
  color: var(--grey-6); line-height: 1.85; max-width: 440px;
  animation: fadeUp .8s var(--ease) .22s both;
}
.hero__btns {
  display: flex; gap: .8rem; flex-wrap: wrap;
  animation: fadeUp .8s var(--ease) .3s both;
}
/* right side — stats grid */
.hero__right {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 1px; background: var(--grey-3);
  border: 1px solid var(--grey-3);
  animation: fadeUp .8s var(--ease) .2s both;
}
.hero__stat {
  background: var(--black); padding: 2rem 1.5rem;
  display: flex; flex-direction: column; gap: .3rem;
  transition: background .2s;
}
.hero__stat:hover { background: var(--grey-2); }
.hero__stat-num {
  font-family: var(--ff-title); font-weight: 800;
  font-size: clamp(2rem, 4vw, 3rem); color: var(--white);
  line-height: 1; letter-spacing: -.03em;
}
.hero__stat-lbl {
  font-family: var(--ff-mono); font-size: .58rem;
  letter-spacing: .22em; text-transform: uppercase; color: var(--grey-5);
}
@keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }

/* ============================================================
   ABOUT
   ============================================================ */
/* ======= EDIT ABOUT SECTION HERE ======= */
.about { padding: 7rem 0; }
.about__grid {
  display: grid; grid-template-columns: 1fr 1.2fr;
  gap: clamp(2rem, 6vw, 6rem); align-items: center;
}
.about__visual {
  aspect-ratio: 1; background: var(--grey-2);
  border: 1px solid var(--grey-3); position: relative; overflow: hidden;
  display: flex; align-items: center; justify-content: center;
}
.about__visual::before {
  content: ''; position: absolute; inset: 0;
  background: radial-gradient(ellipse at 50% 60%, rgba(255,255,255,.04) 0%, transparent 65%);
}
/* corner accents */
.about__visual::after {
  content: ''; position: absolute; inset: 14px;
  border: 1px solid rgba(255,255,255,.06); pointer-events: none;
}
.about__logo { width: 62%; filter: brightness(0) invert(1); opacity: .7; position: relative; z-index: 1; }
.about__content { display: flex; flex-direction: column; gap: 1.5rem; }
.about__body { font-size: clamp(.88rem, 1.4vw, 1rem); font-weight: 300; color: var(--grey-6); line-height: 1.9; }
.about__body + .about__body { margin-top: -.5rem; }
.pillars {
  display: grid; grid-template-columns: 1fr 1fr; gap: 1px;
  background: var(--grey-3); border: 1px solid var(--grey-3); margin-top: .5rem;
}
.pillar {
  background: var(--black); padding: 1rem 1.1rem;
  display: flex; align-items: center; gap: .7rem;
  transition: background .18s;
}
.pillar:hover { background: var(--grey-2); }
.pillar__icon { font-size: .9rem; }
.pillar__name {
  font-family: var(--ff-title); font-weight: 700; font-size: .75rem;
  letter-spacing: .08em; text-transform: uppercase; color: var(--white);
}

/* ============================================================
   TEAM — PLACEHOLDER READY
   ============================================================ */
/* ======= EDIT TEAM SECTION HERE ======= */
.team-section { background: var(--grey-1); padding: 7rem 0; }
.team__header { display: flex; align-items: flex-end; justify-content: space-between; gap: 2rem; margin-bottom: 3rem; flex-wrap: wrap; }
.team__grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 1px; background: var(--grey-3);
  border: 1px solid var(--grey-3);
}
.tcard {
  background: var(--grey-1); padding: 2rem 1.6rem;
  position: relative; overflow: hidden; transition: background .22s;
  /* ======= INDIVIDUAL TEAM CARD — EDIT HERE ======= */
}
.tcard:hover { background: var(--grey-2); }
.tcard::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
  background: var(--white); opacity: 0; transition: opacity .22s;
}
.tcard:hover::before { opacity: 1; }
/* avatar placeholder */
.tcard__avatar {
  width: 52px; height: 52px; border-radius: 50%;
  background: var(--grey-3); border: 1px solid var(--grey-4);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--ff-title); font-weight: 800; font-size: 1.1rem;
  color: var(--grey-5); margin-bottom: 1.2rem;
  /* ======= REPLACE WITH <img> WHEN PHOTO AVAILABLE ======= */
}
.tcard__role {
  font-family: var(--ff-mono); font-size: .58rem;
  letter-spacing: .24em; text-transform: uppercase; color: var(--grey-5);
  margin-bottom: .5rem;
}
.tcard__name {
  font-family: var(--ff-title); font-weight: 800; font-size: 1.05rem;
  color: var(--white); line-height: 1.2; margin-bottom: 1.2rem;
  letter-spacing: -.01em;
}
.tcard__contacts { display: flex; flex-direction: column; gap: .35rem; }
.tcard__contacts li {
  font-family: var(--ff-body); font-size: .75rem; color: var(--grey-5);
  display: flex; align-items: flex-start; gap: .4rem; font-weight: 300;
}
.tcard__contacts li span { font-size: .65rem; color: var(--grey-4); margin-top: .1rem; flex-shrink: 0; }

/* ============================================================
   EVENTS
   ============================================================ */
/* ======= EDIT EVENTS SECTION HERE ======= */
.events-section { padding: 7rem 0; }
.events__list {
  display: flex; flex-direction: column;
  gap: 1px; background: var(--grey-3);
  border: 1px solid var(--grey-3);
}
.ev {
  /* ======= INDIVIDUAL EVENT ROW — EDIT HERE ======= */
  background: var(--black);
  display: grid; grid-template-columns: 56px 1fr auto;
  gap: 0 2rem; align-items: center;
  padding: 1.8rem 2rem; position: relative;
  transition: background .18s; overflow: hidden;
}
.ev:hover { background: var(--grey-2); }
/* highlight stripe for milestone events */
.ev--hl { background: var(--grey-2); }
.ev--hl::before {
  content: ''; position: absolute;
  left: 0; top: 0; bottom: 0; width: 2px;
  background: var(--white);
}
.ev__num {
  font-family: var(--ff-mono); font-size: .68rem;
  color: var(--grey-4); letter-spacing: .1em; text-align: center;
}
.ev__body {}
.ev__name {
  font-family: var(--ff-title); font-weight: 800;
  font-size: clamp(.95rem, 2vw, 1.15rem);
  color: var(--white); line-height: 1.2; margin-bottom: .4rem;
  letter-spacing: -.01em;
}
.ev__tags { display: flex; gap: .5rem; flex-wrap: wrap; margin-bottom: .45rem; }
.ev__tag {
  font-family: var(--ff-mono); font-size: .55rem;
  letter-spacing: .18em; text-transform: uppercase;
  border: 1px solid var(--grey-4); color: var(--grey-5);
  padding: .15rem .5rem;
}
.ev__tag--hi { border-color: var(--grey-6); color: var(--grey-7); }
.ev__tag--sp { border-color: rgba(255,255,255,.3); color: var(--white); }
.ev__desc {
  font-size: .83rem; font-weight: 300; color: var(--grey-5); line-height: 1.65;
  margin-bottom: .5rem;
}
.ev__link {
  display: inline-flex; align-items: center; gap: .35rem;
  font-family: var(--ff-mono); font-size: .62rem; letter-spacing: .12em;
  text-transform: uppercase; color: var(--white);
  transition: gap .18s;
}
.ev__link:hover { gap: .6rem; }
.ev__meta {
  display: flex; flex-direction: column; gap: .6rem;
  text-align: right; min-width: 120px;
}
.ev__val {
  font-family: var(--ff-title); font-weight: 800;
  font-size: 1.15rem; color: var(--white); line-height: 1;
}
.ev__key {
  font-family: var(--ff-mono); font-size: .52rem;
  letter-spacing: .18em; text-transform: uppercase; color: var(--grey-5);
}
.ev__badge {
  position: absolute; top: 0; right: 0;
  background: var(--white); color: var(--black);
  font-family: var(--ff-mono); font-size: .5rem; font-weight: 700;
  letter-spacing: .2em; text-transform: uppercase;
  padding: .2rem .7rem;
  clip-path: polygon(5px 0%, 100% 0%, 100% 100%, 0% 100%);
}
.ev__badge--inv {
  background: var(--black); color: var(--white);
  border: 1px solid var(--grey-4); clip-path: none;
}

/* ============================================================
   PARTNERS TICKER — infinite scroll
   ============================================================ */
/* ======= EDIT PARTNERS SECTION HERE ======= */
.partners-section { padding: 7rem 0; background: var(--grey-1); }
.partners__header { margin-bottom: 3.5rem; }

/* ticker wrapper */
.ticker-wrap {
  overflow: hidden; position: relative;
  /* fade edges */
  mask-image: linear-gradient(90deg, transparent 0%, black 8%, black 92%, transparent 100%);
  -webkit-mask-image: linear-gradient(90deg, transparent 0%, black 8%, black 92%, transparent 100%);
}
.ticker-track {
  display: flex; gap: 1px;
  /* total width = 2× content so loop is seamless */
  width: max-content;
  animation: ticker 28s linear infinite;
  background: var(--grey-3);
}
.ticker-track:hover { animation-play-state: paused; }
@keyframes ticker {
  from { transform: translateX(0); }
  to   { transform: translateX(-50%); }
}
/* partner card inside ticker */
.pcard {
  /* ======= INDIVIDUAL PARTNER CARD — EDIT HERE ======= */
  background: var(--black);
  width: 220px; flex-shrink: 0;
  padding: 2rem 1.5rem;
  display: flex; flex-direction: column; gap: .9rem;
  transition: background .2s; border-right: 1px solid var(--grey-3);
  cursor: default;
}
.pcard:hover { background: var(--grey-2); }
.pcard__logo {
  /* ======= PARTNER LOGO PLACEHOLDER — REPLACE WITH <img> LATER ======= */
  width: 48px; height: 48px;
  background: var(--grey-3); border: 1px solid var(--grey-4);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--ff-mono); font-size: .7rem; color: var(--grey-5);
  letter-spacing: .05em; border-radius: var(--r);
}
.pcard__type {
  font-family: var(--ff-mono); font-size: .55rem;
  letter-spacing: .22em; text-transform: uppercase; color: var(--grey-5);
}
.pcard__name {
  font-family: var(--ff-title); font-weight: 800; font-size: .95rem;
  color: var(--white); line-height: 1.2; letter-spacing: -.01em;
}
.pcard__desc {
  font-size: .75rem; font-weight: 300; color: var(--grey-5); line-height: 1.6;
}
.pcard__pill {
  display: inline-block; font-family: var(--ff-mono); font-size: .5rem;
  letter-spacing: .16em; text-transform: uppercase;
  border: 1px solid var(--grey-4); color: var(--grey-6);
  padding: .15rem .5rem; align-self: flex-start;
}

/* ============================================================
   MIND SCORCH ROSTER
   ============================================================ */
/* ======= EDIT ROSTER SECTION HERE ======= */
.roster-section { padding: 7rem 0; }
.roster__inner {
  display: grid; grid-template-columns: 1fr 1.4fr; gap: 4rem; align-items: start;
}
.roster__left {}
.roster__team-badge {
  display: inline-flex; align-items: center; gap: .5rem;
  font-family: var(--ff-mono); font-size: .58rem;
  letter-spacing: .22em; text-transform: uppercase;
  border: 1px solid var(--grey-4); color: var(--grey-5);
  padding: .3rem .7rem; margin-bottom: 1.2rem;
}
.roster__team-name {
  font-family: var(--ff-title); font-weight: 800;
  font-size: clamp(2rem, 5vw, 3.5rem); color: var(--white);
  line-height: .95; letter-spacing: -.02em; margin-bottom: .6rem;
}
.roster__game {
  font-family: var(--ff-mono); font-size: .65rem;
  letter-spacing: .2em; text-transform: uppercase; color: var(--grey-5);
  margin-bottom: 1.2rem;
}
.roster__desc {
  font-size: .9rem; font-weight: 300; color: var(--grey-5); line-height: 1.8;
  margin-bottom: 2rem;
}
.roster__players {
  display: flex; flex-direction: column;
  gap: 1px; background: var(--grey-3);
  border: 1px solid var(--grey-3);
}
.rplayer {
  /* ======= INDIVIDUAL PLAYER ROW — EDIT HERE ======= */
  background: var(--black); padding: 1rem 1.2rem;
  display: grid; grid-template-columns: 28px 1fr auto;
  align-items: center; gap: .8rem;
  transition: background .18s;
}
.rplayer:hover { background: var(--grey-2); }
.rplayer__num {
  font-family: var(--ff-mono); font-size: .6rem;
  color: var(--grey-5); letter-spacing: .1em;
}
.rplayer__name {
  font-family: var(--ff-title); font-weight: 700; font-size: .95rem;
  color: var(--white); letter-spacing: -.01em;
}
.rplayer__ign {
  font-family: var(--ff-mono); font-size: .62rem;
  color: var(--grey-5); letter-spacing: .06em;
  /* ======= SHOW PLAYER IGN — EDIT HERE ======= */
}
.rplayer__role {
  font-family: var(--ff-mono); font-size: .55rem;
  letter-spacing: .18em; text-transform: uppercase;
  border: 1px solid var(--grey-4); color: var(--grey-6);
  padding: .15rem .5rem;
}
.roster__note {
  font-family: var(--ff-mono); font-size: .6rem;
  color: var(--grey-4); letter-spacing: .1em; margin-top: 1rem;
  font-style: italic;
}

/* ============================================================
   CONTACT
   ============================================================ */
/* ======= EDIT CONTACT SECTION HERE ======= */
.contact-section { background: var(--grey-1); padding: 7rem 0; }
.contact__grid { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(2rem, 6vw, 6rem); align-items: start; }
.contact__title {
  font-family: var(--ff-title); font-weight: 800;
  font-size: clamp(1.8rem, 4vw, 3rem); color: var(--white);
  line-height: 1; letter-spacing: -.02em; margin-bottom: .8rem;
}
.contact__p { font-size: .9rem; font-weight: 300; color: var(--grey-5); line-height: 1.8; margin-bottom: 2rem; }
.cdetails { border-top: 1px solid var(--grey-3); }
.cdetail {
  display: flex; align-items: center; gap: 1rem;
  padding: .9rem 0; border-bottom: 1px solid var(--grey-3);
}
.cdetail__icon {
  width: 30px; height: 30px; border: 1px solid var(--grey-3);
  display: flex; align-items: center; justify-content: center;
  color: var(--grey-5); font-size: .75rem; flex-shrink: 0;
}
.cdetail__lbl {
  font-family: var(--ff-mono); font-size: .55rem;
  letter-spacing: .22em; text-transform: uppercase; color: var(--grey-5);
  display: block;
}
.cdetail__val { font-size: .82rem; color: var(--white); }
.cdetail__val a { transition: color .15s; }
.cdetail__val a:hover { color: var(--grey-6); }
.soc-label {
  font-family: var(--ff-mono); font-size: .58rem;
  letter-spacing: .22em; text-transform: uppercase;
  color: var(--grey-5); margin: 1.8rem 0 .8rem;
}
.soc-row { display: flex; gap: .5rem; flex-wrap: wrap; }
.soc {
  display: inline-flex; align-items: center; gap: .4rem;
  background: transparent; border: 1px solid var(--grey-3);
  color: var(--grey-5); font-family: var(--ff-mono);
  font-size: .62rem; letter-spacing: .12em; text-transform: uppercase;
  padding: .5rem .9rem; border-radius: var(--r); transition: all .18s;
}
.soc:hover { border-color: var(--white); color: var(--white); }
/* form */
.form-title {
  font-family: var(--ff-title); font-weight: 800;
  font-size: 1.5rem; color: var(--white); letter-spacing: -.01em; margin-bottom: 1.5rem;
}
.field { margin-bottom: .85rem; }
.field label {
  display: block; font-family: var(--ff-mono); font-size: .58rem;
  letter-spacing: .2em; text-transform: uppercase; color: var(--grey-5); margin-bottom: .4rem;
}
.field input, .field textarea, .field select {
  width: 100%; background: var(--black); border: 1px solid var(--grey-3);
  color: var(--white); font-family: var(--ff-body); font-size: .88rem;
  padding: .75rem .9rem; outline: none; border-radius: var(--r);
  transition: border-color .18s; resize: vertical;
  -webkit-appearance: none;
}
.field input:focus, .field textarea:focus, .field select:focus { border-color: var(--grey-6); }
.field select option { background: var(--grey-2); }
.field textarea { min-height: 100px; }
.form-submit {
  width: 100%; background: var(--white); color: var(--black);
  font-family: var(--ff-title); font-weight: 700; font-size: .8rem;
  letter-spacing: .14em; text-transform: uppercase;
  padding: .95rem; border: none; border-radius: var(--r);
  cursor: pointer; margin-top: .3rem; transition: all .2s;
}
.form-submit:hover { background: var(--off-wh); transform: translateY(-1px); box-shadow: 0 6px 20px rgba(255,255,255,.1); }

/* ============================================================
   FOOTER
   ============================================================ */
.footer {
  background: var(--black); border-top: 1px solid var(--grey-3);
  padding: 1.6rem var(--pad);
  display: flex; align-items: center; justify-content: space-between;
  flex-wrap: wrap; gap: 1rem;
}
.footer__logo { height: 22px; filter: brightness(0) invert(1); opacity: .5; }
.footer__tag {
  font-family: var(--ff-mono); font-size: .6rem;
  letter-spacing: .22em; text-transform: uppercase; color: var(--grey-5);
}
.footer__copy {
  font-family: var(--ff-mono); font-size: .58rem;
  letter-spacing: .08em; color: var(--grey-4);
}

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media (max-width: 1024px) {
  .ev { grid-template-columns: 40px 1fr; }
  .ev__meta { display: none; }
  .team__grid { grid-template-columns: 1fr 1fr; }
  .roster__inner { grid-template-columns: 1fr; gap: 2.5rem; }
}
@media (max-width: 768px) {
  :root { --nav-h: 56px; }
  /* hide desktop nav items */
  .nav__links, .nav__cta { display: none; }
  .nav__ham { display: flex; }
  /* hero stacks */
  .hero__inner {
    grid-template-columns: 1fr;
    padding: 3rem var(--pad) 2rem;
    gap: 2.5rem;
  }
  .hero__right {
    grid-template-columns: 1fr 1fr;
  }
  .hero__stat { padding: 1.3rem 1rem; }
  /* about */
  .about__grid { grid-template-columns: 1fr; gap: 2.5rem; }
  .about__visual { max-width: 300px; }
  /* contact */
  .contact__grid { grid-template-columns: 1fr; gap: 3rem; }
  /* events */
  .ev { grid-template-columns: 1fr; padding: 1.3rem 1.2rem; }
  .ev__num { display: none; }
  /* footer */
  .footer { flex-direction: column; align-items: flex-start; gap: .5rem; }
  /* partners card width */
  .pcard { width: 180px; }
}
@media (max-width: 540px) {
  .team__grid { grid-template-columns: 1fr; }
  .pillars { grid-template-columns: 1fr 1fr; }
  .hero__btns { flex-direction: column; }
  .btn { justify-content: center; text-align: center; }
  .hero__right { grid-template-columns: 1fr 1fr; }
  .hero__stat-num { font-size: 1.8rem; }
  .soc-row { gap: .4rem; }
}
@media (max-width: 380px) {
  .hero__right { grid-template-columns: 1fr 1fr; }
  .pcard { width: 160px; }
}
</style>
</head>
